"$schema" = "https://raw.githubusercontent.com/JanDeDobbeleer/oh-my-posh/main/themes/schema.json"
version = 3
console_title_template = '{{if .Root}} ⚡ {{end}}{{.Folder | replace "~" "🏠"}} @ {{.Host}}'

# ── Block 1: Left prompt ─────────────────────────────────────────────

[[blocks]]
type = "prompt"
alignment = "left"

  [[blocks.segments]]
  type = "os"
  style = "diamond"
  leading_diamond = "\u250c"
  trailing_diamond = "\ue0b0"
  template = ' {{ if .WSL }}WSL at {{ end }}{{.Icon}} '
  foreground = "#011627"
  background = "#21c7a8"
    [blocks.segments.properties]
    cache_duration = "none"
    windows = "\uf871"

  [[blocks.segments]]
  type = "root"
  style = "diamond"
  leading_diamond = "<transparent,#ef5350>\ue0b0</>"
  trailing_diamond = "\ue0b0"
  template = " \uf0e7 "
  foreground = "#ffeb95"
  background = "#ef5350"
    [blocks.segments.properties]
    cache_duration = "none"
    root_icon = "\uf292 "

  [[blocks.segments]]
  type = "path"
  style = "diamond"
  leading_diamond = "<transparent,#82AAFF>\ue0b0</>"
  trailing_diamond = "\ue0b0"
  template = " {{ .Path }} "
  foreground = "#011627"
  background = "#82AAFF"
    [blocks.segments.properties]
    cache_duration = "none"
    folder_icon = "\uf115 "
    folder_separator_icon = ' <#011627>\ue0b1</> '
    home_icon = "\uf46d "
    style = "short"

  [[blocks.segments]]
  type = "git"
  style = "powerline"
  powerline_symbol = "\ue0b0"
  template = ' {{ .UpstreamIcon }}{{ .HEAD }}{{ .BranchStatus }}{{ if .Working.Changed }} \uf044 {{ .Working.String }}{{ end }}{{ if and (.Working.Changed) (.Staging.Changed) }} |{{ end }}{{ if .Staging.Changed }}<#ef5350> \uf046 {{ .Staging.String }}</>{{ end }} '
  foreground = "#011627"
  background = "#22da6e"
  background_templates = [
    "{{ if or (.Working.Changed) (.Staging.Changed) }}#ffeb95{{ end }}",
    "{{ if and (gt .Ahead 0) (gt .Behind 0) }}#c5e478{{ end }}",
    "{{ if gt .Ahead 0 }}#C792EA{{ end }}",
    "{{ if gt .Behind 0 }}#C792EA{{ end }}",
  ]
    [blocks.segments.properties]
    branch_ahead_icon = "\u2191"
    branch_behind_icon = "\u2193"
    branch_gone = "\u2262"
    branch_icon = "\ue725 "
    branch_identical_icon = "\u2261"
    cache_duration = "none"
    cherry_pick_icon = "✓ "
    commit_icon = "\u25b7 "
    fetch_stash_count = true
    fetch_status = true
    fetch_upstream_icon = true
    merge_icon = "\u25f4 "
    no_commits_icon = "[no commits]"
    rebase_icon = "\u2c62 "
    tag_icon = "\u25b6 "

  [[blocks.segments]]
  type = "executiontime"
  style = "diamond"
  leading_diamond = "<transparent,#575656>\ue0b0</>"
  template = " {{ .FormattedMs }} "
  foreground = "#d6deeb"
  background = "#575656"
    [blocks.segments.properties]
    cache_duration = "none"
    style = "roundrock"
    threshold = 0

  [[blocks.segments]]
  type = "status"
  style = "diamond"
  trailing_diamond = "\ue0b4"
  template = "<parentBackground>\ue0b0</> \ue23a "
  foreground = "#ffffff"
  background = "#00897b"
  background_templates = [
    "{{ if gt .Code 0 }}#e91e63{{ end }}",
    "{{ if gt .Code 0 }}#f1184c{{ end }}",
  ]
    [blocks.segments.properties]
    always_enabled = true
    cache_duration = "none"
    display_exit_code = true

# ── Block 2: Right prompt ────────────────────────────────────────────

[[blocks]]
type = "prompt"
alignment = "right"

  [[blocks.segments]]
  type = "angular"
  style = "diamond"
  leading_diamond = " \ue0b6"
  trailing_diamond = "\ue0b4"
  template = "\ue753 {{ .Full }}"
  foreground = "#000000"
  background = "#1976d2"
    [blocks.segments.properties]
    cache_duration = "none"

  [[blocks.segments]]
  type = "node"
  style = "diamond"
  leading_diamond = " \ue0b6"
  trailing_diamond = "\ue0b4"
  template = '\ue718{{ if .PackageManagerIcon }}{{ .PackageManagerIcon }} {{ end }}{{ .Full }}'
  foreground = "#3C873A"
  background = "#303030"
    [blocks.segments.properties]
    cache_duration = "none"
    fetch_package_manager = true
    npm_icon = ' <#cc3a3a>\ue71e</> '
    yarn_icon = ' <#348cba>\uf61a</>'

  [[blocks.segments]]
  type = "python"
  style = "diamond"
  leading_diamond = " \ue0b6"
  trailing_diamond = "\ue0b4"
  template = '\ue235 {{ if .Error }}{{ .Error }}{{ else }}{{ if .Venv }}{{ .Venv }} {{ end }}{{ .Full }}{{ end }}'
  foreground = "#FFE873"
  background = "#306998"
    [blocks.segments.properties]
    cache_duration = "none"

  [[blocks.segments]]
  type = "java"
  style = "diamond"
  leading_diamond = " \ue0b6"
  trailing_diamond = "\ue0b4"
  template = '\ue738 {{ if .Error }}{{ .Error }}{{ else }}{{ .Full }}{{ end }}'
  foreground = "#ec2729"
  background = "#0e8ac8"
    [blocks.segments.properties]
    cache_duration = "none"

  [[blocks.segments]]
  type = "dotnet"
  style = "diamond"
  leading_diamond = " \ue0b6"
  trailing_diamond = "\ue0b4"
  template = '\ue77f {{ if .Unsupported }}\uf071{{ else }}{{ .Full }}{{ end }}'
  foreground = "#0d6da8"
  background = "#0e0e0e"
    [blocks.segments.properties]
    cache_duration = "none"

  [[blocks.segments]]
  type = "go"
  style = "diamond"
  leading_diamond = " \ue0b6"
  trailing_diamond = "\ue0b4"
  template = '\ufcd1 {{ if .Error }}{{ .Error }}{{ else }}{{ .Full }}{{ end }}'
  foreground = "#06aad5"
  background = "#ffffff"
    [blocks.segments.properties]
    cache_duration = "none"

  [[blocks.segments]]
  type = "rust"
  style = "diamond"
  leading_diamond = " \ue0b6"
  trailing_diamond = "\ue0b4"
  template = '\ue7a8 {{ if .Error }}{{ .Error }}{{ else }}{{ .Full }}{{ end }}'
  foreground = "#925837"
  background = "#f3f0ec"
    [blocks.segments.properties]
    cache_duration = "none"

  [[blocks.segments]]
  type = "dart"
  style = "diamond"
  leading_diamond = " \ue0b6"
  trailing_diamond = "\ue0b4"
  template = '\ue798 {{ if .Error }}{{ .Error }}{{ else }}{{ .Full }}{{ end }}'
  foreground = "#055b9c"
  background = "#e1e8e9"
    [blocks.segments.properties]
    cache_duration = "none"

  [[blocks.segments]]
  type = "julia"
  style = "diamond"
  leading_diamond = " \ue0b6"
  trailing_diamond = "\ue0b4"
  template = '<#ca3c34>\ue624</> {{ if .Error }}{{ .Error }}{{ else }}{{ .Full }}{{ end }}'
  foreground = "#359a25"
  background = "#945bb3"
    [blocks.segments.properties]
    cache_duration = "none"

  [[blocks.segments]]
  type = "ruby"
  style = "diamond"
  leading_diamond = " \ue0b6"
  trailing_diamond = "\ue0b4"
  template = '\ue791 {{ if .Error }}{{ .Error }}{{ else }}{{ .Full }}{{ end }}'
  foreground = "#9c1006"
  background = "#ffffff"
    [blocks.segments.properties]
    cache_duration = "none"

  [[blocks.segments]]
  type = "azfunc"
  style = "diamond"
  leading_diamond = " \ue0b6"
  trailing_diamond = "\ue0b4"
  template = '\uf104<#f5bf45>\uf0e7</>\uf105 {{ if .Error }}{{ .Error }}{{ else }}{{ .Full }}{{ end }}'
  foreground = "#5398c2"
  background = "#ffffff"
    [blocks.segments.properties]
    cache_duration = "none"

  [[blocks.segments]]
  type = "aws"
  style = "diamond"
  leading_diamond = " \ue0b6"
  trailing_diamond = "\ue0b4"
  template = '\ue7ad {{.Profile}}{{if .Region}}@{{.Region}}{{end}}'
  foreground = "#faa029"
  background = "#565656"
    [blocks.segments.properties]
    cache_duration = "none"

  [[blocks.segments]]
  type = "kubectl"
  style = "diamond"
  leading_diamond = " \ue0b6"
  trailing_diamond = "\ue0b4"
  template = '\ufd31 {{.Context}}{{if .Namespace}} :: {{.Namespace}}{{end}}'
  foreground = "#ffffff"
  background = "#316ce4"
    [blocks.segments.properties]
    cache_duration = "none"

  [[blocks.segments]]
  type = "time"
  style = "diamond"
  leading_diamond = "\ue0c5"
  trailing_diamond = "\ue0c4"
  template = '<#ffffff> \uf64f </>{{ .CurrentDate | date .Format }} '
  foreground = "#d6deeb"
  background = "#234d70"
    [blocks.segments.properties]
    cache_duration = "none"
    time_format = "15:04:05"

# ── Block 3: Second-line prompt ──────────────────────────────────────

[[blocks]]
type = "prompt"
alignment = "left"
newline = true

  [[blocks.segments]]
  type = "text"
  style = "plain"
  template = "\u2514\u2500"
  foreground = "#21c7a8"
    [blocks.segments.properties]
    cache_duration = "none"

  [[blocks.segments]]
  type = "spotify"
  style = "diamond"
  leading_diamond = "\ue0b6"
  trailing_diamond = "\ue0c6 "
  template = ' {{ .Icon }}{{ if ne .Status "stopped" }}{{ .Artist }} - {{ .Track }}{{ end }} '
  foreground = "#011627"
  background = "#1DB954"
    [blocks.segments.properties]
    cache_duration = "none"
    playing_icon = "\uf1bc "
    track_separator = " ~ "

  [[blocks.segments]]
  type = "status"
  style = "plain"
  template = "\ue285\ue285 "
  foreground = "#22da6e"
  foreground_templates = [
    "{{ if gt .Code 0 }}#ef5350{{ end }}",
  ]
    [blocks.segments.properties]
    always_enabled = true
    cache_duration = "none"
